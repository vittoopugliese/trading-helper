# Trading Helper Agent configuration

binance:
  base_url: https://fapi.binance.com
  market: futures_um

# Pairs to watch (Binance Futures USDT-M symbols)
watchlist:
  - HYPEUSDT
  - BTCUSDT

# Default timeframes for multi-TF analysis.
# Scalp: 1m ejecucion; 5m/15m/1h = estructura Elliott + order flow
timeframes:
  scalp: 1m
  intraday: 5m
  swing: 15m
  macro: 1h

# How many candles to fetch per timeframe
candle_limits:
  1m: 200
  5m: 200
  15m: 200
  1h: 300
  4h: 300
  8h: 300
  1d: 400

# A+ scoring thresholds
scoring:
  a_plus_threshold: 0.85
  min_rr: 2.0

# Scoring weights per trade type (must sum to 1.0 per type)
weights:
  swing:
    trend_alignment: 0.08
    delta_cvd: 0.12
    volume_spike: 0.08
    oi_confirmation: 0.08
    funding_neutral: 0.05
    structure_swing: 0.05
    risk_reward: 0.10
    price_in_poi: 0.12
    invalidation_respected: 0.12
    of_confirmation_at_poi: 0.12
    cvd_divergence: 0.08
  scalp:
    delta_cvd: 0.15
    volume_spike: 0.10
    structure_swing: 0.05
    oi_confirmation: 0.05
    funding_neutral: 0.03
    trend_alignment: 0.04
    risk_reward: 0.08
    price_in_poi: 0.18
    invalidation_respected: 0.12
    of_confirmation_at_poi: 0.15
    cvd_divergence: 0.05

# Condition thresholds
thresholds:
  volume_spike_ratio: 1.5
  rsi_oversold: 35
  rsi_overbought: 65
  swing_lookback: 5
  atr_stop_multiplier: 1.5
  atr_target_multiplier: 3.0
  poi_proximity_pct: 0.003
  poi_tolerance_pct: 0.001
  # Si el precio se aleja mas de esto del POI, el contexto Elliott se considera
  # DESACTUALIZADO: no se derivan entry/stop/targets de el y el grade baja a NO_TRADE.
  context_stale_pct: 0.08
  # Un contexto editado hace mas de N dias deja de ser vigente aunque el precio vuelva al POI.
  context_max_age_days: 7
  book_imbalance_ratio: 1.3
  absorption_delta_ratio: 0.6

# Order flow REST params
order_flow:
  agg_trades_limit: 1000
  depth_limit: 20
  cvd_lookback_trades: 200
  divergence_lookback: 20

# Risk management defaults — cuenta real $300, leverage x10
# Ver notes/setup-rules/risk-sizing-cuenta.md (margen != riesgo; el SL define el riesgo).
risk:
  default_account_size: 300
  max_risk_pct: 7.0        # TOPE DURO confirmado: 7% = $21 por trade. Bajar size, no SL.
  max_risk_usd: 21         # riesgo $ maximo por trade (lo que se pierde si salta el SL)
  leverage: 10
  margin_standard: 100     # conviccion normal (notional $1000)
  margin_high: 200         # A+ claro (notional $2000)
  margin_max: 300          # all-in SOLO con SL corto (0.5-0.7%) para no pasar el tope $21
  max_entries: 3           # 1-3 entradas escalonadas en la zona
  max_total_exposure_pct: 10.0  # riesgo combinado si hay 2 trades (HYPE+BTC correlacionados)
  daily_stop_losses: 2     # 2 perdidas seguidas = stop por hoy (anti revenge)
  cost_bps_per_side: 7.0   # fee + slippage por lado, incluido en el sizing (igual que backtest/ledger)

# Scheduler - alert only when price at POI + order flow confirms
scheduler:
  enabled: true
  interval_minutes: 1
  default_trade_type: swing
  alert_only_at_poi: true

# Notes indexing
notes:
  folder: notes
  chunk_size: 500
  chunk_overlap: 50
  top_k: 8            # subido de 5: base de conocimiento mas grande (notes/libros)
  chunk_by_sections: true

# Paths (relative to project root)
paths:
  cache_db: data/cache.db
  sessions_db: data/sessions.db
  chroma_dir: data/chroma
  context_dir: context

# Research defaults. The backtester receives an immutable copy of these
# assumptions per run; simulated trades are never mixed into sessions.db.
history:
  canonical_interval: 1m
  symbols: [HYPEUSDT, BTCUSDT]
  source: binance_usdm_klines

backtest:
  timeframes: [1m, 5m, 15m]
  reward_risks: [2.0, 3.0]
  volume_ratios: [1.3, 1.5, 2.0]
  entry_timing: next_open
  same_bar_policy: stop_first
  one_position_at_a_time: true
  fee_rate_per_side: 0.0005
  slippage_rate_per_side: 0.0002
  train_fraction: 0.70
  output_dir: reports/backtests

# Localhost web cockpit (complemento al CLI/REPL)
web:
  host: 127.0.0.1
  port: 8780
  open_browser: true
  notify_desktop: true    # Windows toast ademas de alertas en la web (false para apagar)

# ATAS bridge (atas-bridge/ -> POST /api/atas/ingest). Ver agent/atas_feed.py.
# Umbrales del footprint definidos ANTES de mirar resultados (no optimizar sobre el journal).
atas:
  require_confirmation_for_a_plus: true  # con ATAS vivo, A+ en POI exige gatillo footprint
  imbalance_ratio: 3.0          # imbalance diagonal: ask[p] >= 3x bid[p-1]
  stacked_levels: 3             # niveles seguidos para "apilado"
  absorption_zone_pct: 0.25     # extremo de la vela = 25% del rango
  absorption_volume_share: 0.35 # >=35% del volumen de la vela en ese extremo
  delta_reversal_share: 0.15    # min delta <= -15% del vol y cierra delta+ (o espejo)
  delta_flip_share: 0.10        # vela previa delta <= -10% vol y actual >= +10% vol
  volume_spike_ratio: 1.5
  lookback_bars: 20
  stale_after_sec: 90           # sin datos nuevos hace mas que esto = ATAS no disponible
  dom_imbalance_ratio: 1.5

# Liquidaciones en vivo (Bybit completo + Binance muestreado), sin keys.
liquidations:
  enabled: true
  symbols: [HYPEUSDT, BTCUSDT]
  spike_zscore: 2.5             # liq 15m vs distribucion de 24h
  min_history_hours: 6          # antes de esto no hay z-score (no se inventa)

# Registro forward de cada alerta + resolucion TP/SL/timeout (mide la confiabilidad real).
signal_ledger:
  cooldown_min: 30              # misma direccion/simbolo no se registra dos veces en 30 min
  max_minutes: 240              # timeout de la etiqueta
  cost_bps_per_side: 7.0        # mismo costo que el backtest (5 fee + 2 slippage)
  min_samples: 30               # por grupo antes de sacar conclusiones

# Modelo de Claude para chat web y analisis profundo (un solo lugar).
llm:
  model: claude-opus-4-8
